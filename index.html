      :root, .dl-root {
        --bg: #EEF1EF;
        --paper: #FFFFFF;
        --ink: #172625;
        --ink-soft: #52625F;
        --line: #DCE3E0;
        --teal: #2C6E5C;
        --teal-dark: #1D4B3F;
        --gold: #D9A441;
        --farmer: #4C7C4A;
        --shop: #3E6690;
        --danger: #B4553F;
        --mono: 'IBM Plex Mono', ui-monospace, monospace;
        --sans: 'Inter', -apple-system, sans-serif;
        --slab: 'Zilla Slab', Georgia, serif;
      }
      .dl-root {
        font-family: var(--sans);
        color: var(--ink);
        background: var(--bg);
        min-height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .dl-root * { box-sizing: border-box; }
      .dl-loading {
        align-items: center; justify-content: center; gap: 10px; padding: 60px;
        flex-direction: row; color: var(--ink-soft);
      }
      .dl-spin { animation: dl-spin 1.2s linear infinite; color: var(--teal); }
      @keyframes dl-spin { to { transform: rotate(360deg); } }

      .dl-header {
        background: var(--teal-dark);
        color: #F3F1E8;
        padding: 14px 20px;
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap;
        border-bottom: 3px solid var(--gold);
      }
      .dl-brand { display: flex; align-items: center; gap: 10px; }
      .dl-brand-mark {
        width: 34px; height: 34px; border-radius: 8px; background: var(--gold);
        color: var(--teal-dark); display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .dl-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
      .dl-brand-title { font-family: var(--slab); font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
      .dl-brand-sub { font-size: 11px; color: #C9D6CF; text-transform: uppercase; letter-spacing: 0.6px; }
      .dl-nav { display: flex; gap: 4px; flex-wrap: wrap; }
      .dl-nav-btn {
        display: flex; align-items: center; gap: 6px;
        background: transparent; border: 1px solid transparent; color: #DCE7E1;
        padding: 7px 11px; border-radius: 7px; font-size: 13px; cursor: pointer;
        transition: all .15s;
      }
      .dl-nav-btn:hover { background: rgba(255,255,255,0.08); }
      .dl-nav-btn.active { background: var(--gold); color: var(--teal-dark); font-weight: 600; }

      .dl-main { flex: 1; padding: 22px; max-width: 1180px; margin: 0 auto; width: 100%; }
      .dl-page { display: flex; flex-direction: column; gap: 18px; }
      .dl-page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .dl-vehicle-bar { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
      .dl-vehicle-bar .dl-select { width: 100%; }
      .dl-vehicle-actions { display: flex; gap: 6px; flex-wrap: wrap; }
      .dl-vehicle-actions button { display: flex; align-items: center; gap: 4px; }
      .dl-vehicle-summary { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--shop); border-radius: 10px; padding: 10px 12px; }
      .dl-vehicle-summary > div { display: flex; flex-direction: column; gap: 2px; }
      .dl-vehicle-summary span { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ink-soft); }
      .dl-vehicle-summary strong { font-family: var(--mono); font-size: 13px; }
      .dl-vehicle-total strong { color: var(--shop); font-size: 14px; }
      .dl-veh-move { max-width: 180px; }
      .dl-vehicle-recon { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--shop); border-radius: 10px; padding: 6px 8px; overflow-x: auto; }
      .dl-vehicle-recon table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .dl-vehicle-recon th { text-align: left; font-size: 10.5px; text-transform: uppercase; color: var(--ink-soft); padding: 4px 6px; border-bottom: 1px solid var(--line); }
      .dl-vehicle-recon th:first-child { color: var(--shop); font-size: 12px; }
      .dl-vehicle-recon td { padding: 5px 6px; border-bottom: 1px solid var(--line); font-family: var(--mono); white-space: nowrap; }
      .dl-vehicle-recon td:first-child { font-family: var(--sans); color: var(--ink-soft); white-space: normal; }
      .dl-vehicle-diff td { font-weight: 700; border-bottom: none; }
      .dl-diff-ok { color: var(--farmer); }
      .dl-diff-off { color: var(--danger); }
      .dl-xfer-add { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); }
      .dl-xfer-add .dl-select { flex: 1; min-width: 120px; }
      .dl-scroll-x { overflow-x: auto; }
      .dl-recon-wide { font-size: 11.5px; }
      .dl-recon-wide td, .dl-recon-wide th { white-space: nowrap; }
      .dl-vehicle-block { margin-top: 14px; }
      .dl-vehicle-sub { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink-soft); }
      .dl-reorder-panel { background: var(--paper); border: 1px solid var(--gold); border-radius: 10px; padding: 8px 10px; }
      .dl-reorder-head { font-size: 12px; color: var(--ink-soft); padding: 4px 2px 8px; line-height: 1.5; }
      .dl-reorder-row { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-top: 1px solid var(--line); }
      .dl-reorder-num { width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .dl-reorder-name { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dl-reorder-btns { display: flex; gap: 4px; flex-shrink: 0; }
      .dl-reorder-btns button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 5px 8px; font-size: 12px; cursor: pointer; font-family: var(--sans); }
      .dl-reorder-btns button:disabled { opacity: 0.3; cursor: not-allowed; }
      .dl-reorder-btns button:not(:disabled):hover { background: #E6F2E9; border-color: var(--farmer); }
      .dl-entry-search { display: flex; align-items: center; gap: 6px; }
      .dl-entry-search input {
        flex: 1; font-family: var(--sans); font-size: 14px; padding: 9px 12px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      }
      .dl-entry-search input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
      .dl-entry-sticky-header {
        position: sticky; top: 0; z-index: 20; background: var(--bg);
        padding: 10px 0 14px; margin: -10px 0 0; display: flex; flex-direction: column; gap: 12px;
        border-bottom: 1px solid var(--line); box-shadow: 0 4px 8px -6px rgba(23,38,37,0.15);
      }
      .dl-page-head h1 {
        font-family: var(--slab); font-size: 22px; font-weight: 600; margin: 0;
        display: flex; align-items: center; gap: 9px; color: var(--teal-dark);
      }

      .dl-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .dl-stat-card {
        background: var(--paper); border-radius: 12px; padding: 16px;
        border-left: 4px solid var(--teal); box-shadow: 0 1px 2px rgba(23,38,37,0.06);
      }
      .dl-tone-farmer { border-left-color: var(--farmer); }
      .dl-tone-shop { border-left-color: var(--shop); }
      .dl-tone-amber { border-left-color: var(--danger); }
      .dl-tone-teal { border-left-color: var(--teal); }
      .dl-tone-gold { border-left-color: var(--gold); }
      .dl-stat-icon { color: var(--ink-soft); margin-bottom: 8px; }
      .dl-stat-label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; }
      .dl-stat-big { font-family: var(--mono); font-size: 24px; font-weight: 600; margin-top: 4px; }
      .dl-stat-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

      .dl-rate-strip {
        background: var(--paper); border-radius: 12px; padding: 12px 16px;
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        border: 1px dashed var(--line);
      }
      .dl-rate-strip-label { font-size: 12px; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
      .dl-rate-pill { display: flex; flex-direction: column; font-size: 11.5px; color: var(--ink-soft); gap: 1px; }
      .dl-rate-pill strong { font-family: var(--mono); font-size: 13px; color: var(--ink); }

      .dl-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
