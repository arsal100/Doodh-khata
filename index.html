      :root, .dl-root {
        --bg: #EEF1EF;
        --paper: #FFFFFF;
        --ink: #172625;
        --ink-soft: #52625F;
        --line: #DCE3E0;
        --teal: #2C6E5C;
        --teal-dark: #1D4B3F;
        --gold: #D9A441;
        --farmer: #4C7C4A;
        --shop: #3E6690;
        --danger: #B4553F;
        --mono: 'IBM Plex Mono', ui-monospace, monospace;
        --sans: 'Inter', -apple-system, sans-serif;
        --slab: 'Zilla Slab', Georgia, serif;
      }
      .dl-root {
        font-family: var(--sans);
        color: var(--ink);
        background: var(--bg);
        min-height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .dl-root * { box-sizing: border-box; }
      .dl-loading {
        align-items: center; justify-content: center; gap: 10px; padding: 60px;
        flex-direction: row; color: var(--ink-soft);
      }
      .dl-spin { animation: dl-spin 1.2s linear infinite; color: var(--teal); }
      @keyframes dl-spin { to { transform: rotate(360deg); } }

      .dl-header {
        background: var(--teal-dark);
        color: #F3F1E8;
        padding: 14px 20px;
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap;
        border-bottom: 3px solid var(--gold);
      }
      .dl-brand { display: flex; align-items: center; gap: 10px; }
      .dl-brand-mark {
        width: 34px; height: 34px; border-radius: 8px; background: var(--gold);
        color: var(--teal-dark); display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .dl-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
      .dl-brand-title { font-family: var(--slab); font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
      .dl-brand-sub { font-size: 11px; color: #C9D6CF; text-transform: uppercase; letter-spacing: 0.6px; }
      .dl-nav { display: flex; gap: 4px; flex-wrap: wrap; }
      .dl-nav-btn {
        display: flex; align-items: center; gap: 6px;
        background: transparent; border: 1px solid transparent; color: #DCE7E1;
        padding: 7px 11px; border-radius: 7px; font-size: 13px; cursor: pointer;
        transition: all .15s;
      }
      .dl-nav-btn:hover { background: rgba(255,255,255,0.08); }
      .dl-nav-btn.active { background: var(--gold); color: var(--teal-dark); font-weight: 600; }

      .dl-main { flex: 1; padding: 22px; max-width: 1180px; margin: 0 auto; width: 100%; }
      .dl-page { display: flex; flex-direction: column; gap: 18px; }
      .dl-page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .dl-entry-sticky-header {
        position: sticky; top: 0; z-index: 20; background: var(--bg);
        padding: 10px 0 14px; margin: -10px 0 0; display: flex; flex-direction: column; gap: 12px;
        border-bottom: 1px solid var(--line); box-shadow: 0 4px 8px -6px rgba(23,38,37,0.15);
      }
      .dl-page-head h1 {
        font-family: var(--slab); font-size: 22px; font-weight: 600; margin: 0;
        display: flex; align-items: center; gap: 9px; color: var(--teal-dark);
      }

      .dl-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .dl-stat-card {
        background: var(--paper); border-radius: 12px; padding: 16px;
        border-left: 4px solid var(--teal); box-shadow: 0 1px 2px rgba(23,38,37,0.06);
      }
      .dl-tone-farmer { border-left-color: var(--farmer); }
      .dl-tone-shop { border-left-color: var(--shop); }
      .dl-tone-amber { border-left-color: var(--danger); }
      .dl-tone-teal { border-left-color: var(--teal); }
      .dl-tone-gold { border-left-color: var(--gold); }
      .dl-stat-icon { color: var(--ink-soft); margin-bottom: 8px; }
      .dl-stat-label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; }
      .dl-stat-big { font-family: var(--mono); font-size: 24px; font-weight: 600; margin-top: 4px; }
      .dl-stat-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

      .dl-rate-strip {
        background: var(--paper); border-radius: 12px; padding: 12px 16px;
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        border: 1px dashed var(--line);
      }
      .dl-rate-strip-label { font-size: 12px; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
      .dl-rate-pill { display: flex; flex-direction: column; font-size: 11.5px; color: var(--ink-soft); gap: 1px; }
      .dl-rate-pill strong { font-family: var(--mono); font-size: 13px; color: var(--ink); }

      .dl-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 720px) { .dl-two-col { grid-template-columns: 1fr; } .dl-header { flex-direction: column; align-items: flex-start; } }

      .dl-card { background: var(--paper); border-radius: 12px; padding: 16px; box-shadow: 0 1px 2px rgba(23,38,37,0.06); }
      .dl-chart-legend { display: flex; gap: 16px; justify-content: center; margin-top: 6px; flex-wrap: wrap; } .dl-chart-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); } .dl-chart-legend-item i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
      .dl-card-head h2 { font-family: var(--slab); font-size: 16px; margin: 0 0 10px; color: var(--teal-dark); }
      .dl-balance-list { display: flex; flex-direction: column; gap: 8px; }
      .dl-balance-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
      .dl-balance-row:last-child { border-bottom: none; }
      .dl-balance-amt { font-family: var(--mono); font-size: 13px; font-weight: 600; }
      .dl-balance-amt.due { color: var(--danger); }
      .dl-balance-amt.clear { color: var(--farmer); font-weight: 500; }
      .dl-balance-amt.credit { color: var(--shop); }

      .dl-tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; padding: 3px 0; }
      .dl-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }
      .dl-tag-farmer::before { background: var(--farmer); }
      .dl-tag-shop::before { background: var(--shop); }

      .dl-btn-primary {
        display: flex; align-items: center; gap: 6px; background: var(--teal); color: #fff;
        border: none; padding: 9px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
        cursor: pointer; transition: background .15s;
      }
      .dl-btn-primary:hover { background: var(--teal-dark); }
      .dl-btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
      .dl-btn-ghost {
        background: transparent; border: 1px solid var(--line); padding: 9px 14px;
        border-radius: 8px; font-size: 13.5px; cursor: pointer; color: var(--ink-soft);
      }

      .dl-empty { color: var(--ink-soft); font-size: 13.5px; font-style: italic; }
      .dl-hint { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }

      .dl-entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
      .dl-entity-card { background: var(--paper); border-radius: 12px; padding: 14px; box-shadow: 0 1px 2px rgba(23,38,37,0.06); }
      .dl-entity-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .dl-entity-actions { display: flex; gap: 4px; }
      .dl-entity-actions button {
        background: var(--bg); border: none; border-radius: 6px; padding: 5px; cursor: pointer; color: var(--ink-soft);
      }
      .dl-entity-actions button:hover { color: var(--ink); }
      .dl-entity-rows { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-soft); }
      .dl-entity-rows div { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
