      :root, .dl-root {
        --bg: #EEF1EF;
        --paper: #FFFFFF;
        --ink: #172625;
        --ink-soft: #52625F;
        --line: #DCE3E0;
        --teal: #2C6E5C;
        --teal-dark: #1D4B3F;
        --gold: #D9A441;
        --farmer: #4C7C4A;
        --shop: #3E6690;
        --danger: #B4553F;
        --mono: 'IBM Plex Mono', ui-monospace, monospace;
        --sans: 'Inter', -apple-system, sans-serif;
        --slab: 'Zilla Slab', Georgia, serif;
      }
      .dl-root {
        font-family: var(--sans);
        color: var(--ink);
        background: var(--bg);
        min-height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .dl-root * { box-sizing: border-box; }
      .dl-loading {
        align-items: center; justify-content: center; gap: 10px; padding: 60px;
        flex-direction: row; color: var(--ink-soft);
      }
      .dl-spin { animation: dl-spin 1.2s linear infinite; color: var(--teal); }
      @keyframes dl-spin { to { transform: rotate(360deg); } }

      .dl-header {
        background: var(--teal-dark);
        color: #F3F1E8;
        padding: 14px 20px;
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap;
        border-bottom: 3px solid var(--gold);
      }
      .dl-brand { display: flex; align-items: center; gap: 10px; }
      .dl-brand-mark {
        width: 34px; height: 34px; border-radius: 8px; background: var(--gold);
        color: var(--teal-dark); display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .dl-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
      .dl-brand-title { font-family: var(--slab); font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
      .dl-brand-sub { font-size: 11px; color: #C9D6CF; text-transform: uppercase; letter-spacing: 0.6px; }
      .dl-nav { display: flex; gap: 4px; flex-wrap: wrap; }
      .dl-nav-btn {
        display: flex; align-items: center; gap: 6px;
        background: transparent; border: 1px solid transparent; color: #DCE7E1;
        padding: 7px 11px; border-radius: 7px; font-size: 13px; cursor: pointer;
        transition: all .15s;
      }
      .dl-nav-btn:hover { background: rgba(255,255,255,0.08); }
      .dl-nav-btn.active { background: var(--gold); color: var(--teal-dark); font-weight: 600; }

      .dl-main { flex: 1; padding: 22px; max-width: 1180px; margin: 0 auto; width: 100%; }
      .dl-page { display: flex; flex-direction: column; gap: 18px; }
      .dl-page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .dl-entry-sticky-header {
        position: sticky; top: 0; z-index: 20; background: var(--bg);
        padding: 10px 0 14px; margin: -10px 0 0; display: flex; flex-direction: column; gap: 12px;
        border-bottom: 1px solid var(--line); box-shadow: 0 4px 8px -6px rgba(23,38,37,0.15);
      }
      .dl-page-head h1 {
        font-family: var(--slab); font-size: 22px; font-weight: 600; margin: 0;
        display: flex; align-items: center; gap: 9px; color: var(--teal-dark);
      }

      .dl-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .dl-stat-card {
        background: var(--paper); border-radius: 12px; padding: 16px;
        border-left: 4px solid var(--teal); box-shadow: 0 1px 2px rgba(23,38,37,0.06);
      }
      .dl-tone-farmer { border-left-color: var(--farmer); }
      .dl-tone-shop { border-left-color: var(--shop); }
      .dl-tone-amber { border-left-color: var(--danger); }
      .dl-tone-teal { border-left-color: var(--teal); }
      .dl-tone-gold { border-left-color: var(--gold); }
      .dl-stat-icon { color: var(--ink-soft); margin-bottom: 8px; }
      .dl-stat-label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; }
      .dl-stat-big { font-family: var(--mono); font-size: 24px; font-weight: 600; margin-top: 4px; }
      .dl-stat-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

      .dl-rate-strip {
        background: var(--paper); border-radius: 12px; padding: 12px 16px;
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        border: 1px dashed var(--line);
      }
      .dl-rate-strip-label { font-size: 12px; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
      .dl-rate-pill { display: flex; flex-direction: column; font-size: 11.5px; color: var(--ink-soft); gap: 1px; }
      .dl-rate-pill strong { font-family: var(--mono); font-size: 13px; color: var(--ink); }

      .dl-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 720px) { .dl-two-col { grid-template-columns: 1fr; } .dl-header { flex-direction: column; align-items: flex-start; } }

      .dl-card { background: var(--paper); border-radius: 12px; padding: 16px; box-shadow: 0 1px 2px rgba(23,38,37,0.06); }
      .dl-chart-legend { display: flex; gap: 16px; justify-content: center; margin-top: 6px; flex-wrap: wrap; } .dl-chart-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); } .dl-chart-legend-item i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
      .dl-card-head h2 { font-family: var(--slab); font-size: 16px; margin: 0 0 10px; color: var(--teal-dark); }
      .dl-balance-list { display: flex; flex-direction: column; gap: 8px; }
      .dl-balance-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
      .dl-balance-row:last-child { border-bottom: none; }
      .dl-balance-amt { font-family: var(--mono); font-size: 13px; font-weight: 600; }
      .dl-balance-amt.due { color: var(--danger); }
      .dl-balance-amt.clear { color: var(--farmer); font-weight: 500; }
      .dl-balance-amt.credit { color: var(--shop); }

      .dl-tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; padding: 3px 0; }
      .dl-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }
      .dl-tag-farmer::before { background: var(--farmer); }
      .dl-tag-shop::before { background: var(--shop); }

      .dl-btn-primary {
        display: flex; align-items: center; gap: 6px; background: var(--teal); color: #fff;
        border: none; padding: 9px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
        cursor: pointer; transition: background .15s;
      }
      .dl-btn-primary:hover { background: var(--teal-dark); }
      .dl-btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
      .dl-btn-ghost {
        background: transparent; border: 1px solid var(--line); padding: 9px 14px;
        border-radius: 8px; font-size: 13.5px; cursor: pointer; color: var(--ink-soft);
      }

      .dl-empty { color: var(--ink-soft); font-size: 13.5px; font-style: italic; }
      .dl-hint { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }

      .dl-entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
      .dl-entity-card { background: var(--paper); border-radius: 12px; padding: 14px; box-shadow: 0 1px 2px rgba(23,38,37,0.06); }
      .dl-entity-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .dl-entity-actions { display: flex; gap: 4px; }
      .dl-entity-actions button {
        background: var(--bg); border: none; border-radius: 6px; padding: 5px; cursor: pointer; color: var(--ink-soft);
      }
      .dl-entity-actions button:hover { color: var(--ink); }
      .dl-entity-rows { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-soft); }
      .dl-entity-rows div { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
      .dl-entity-rows span { font-family: var(--mono); color: var(--ink); font-weight: 500; }
      .dl-flatrate-badge {
        display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--gold);
        background: #FBF3E1; border: 1px dashed var(--gold); border-radius: 6px; padding: 5px 8px; font-weight: 600;
      }
      .dl-flatrate-toggle {
        display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink);
        background: var(--bg); border-radius: 8px; padding: 9px 11px; cursor: pointer;
      }
      .dl-flatrate-toggle input { width: 15px; height: 15px; accent-color: var(--gold); cursor: pointer; }
      .dl-flatrate-toggle em { font-style: normal; font-weight: 600; }

      .dl-contract-badge { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }
      .dl-contract-badge span { color: var(--shop); font-family: var(--mono); }
      .dl-milktype-block { background: var(--bg); border-radius: 7px; padding: 7px 9px; margin-top: 4px; }
      .dl-milktype-label { font-weight: 700; font-size: 12px; color: var(--teal-dark); margin-bottom: 3px; }
      .dl-milktype-editor { background: var(--bg); border-radius: 10px; padding: 12px; margin: 8px 0; display: flex; flex-direction: column; gap: 10px; }
      .dl-milktype-editor-head { font-weight: 700; font-size: 13px; color: var(--teal-dark); }
      .dl-milktype-enable-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .dl-milktype-enable-toggle input { width: 15px; height: 15px; accent-color: var(--shop); cursor: pointer; }
      .dl-milktype-noquota-toggle { margin: 4px 0 2px; font-size: 12px; color: var(--ink-soft); }
      .dl-milktype-noquota-toggle input { accent-color: var(--gold); }
      .dl-noquota-tag { font-size: 10.5px; font-weight: 600; color: var(--gold); text-transform: none; }

      .dl-modal-backdrop {
        position: fixed; inset: 0; background: rgba(23,38,37,0.45); display: flex;
        align-items: center; justify-content: center; z-index: 50; padding: 16px;
      }
      .dl-modal { background: var(--paper); border-radius: 14px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
      .dl-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
      .dl-modal-head h3 { font-family: var(--slab); margin: 0; font-size: 17px; }
      .dl-modal-head button { background: none; border: none; cursor: pointer; color: var(--ink-soft); }
      .dl-modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
      .dl-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .dl-modal-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
      .dl-modal-wide { max-width: 640px; }
      .dl-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
      .dl-openbal-block { border: 1px dashed var(--gold); border-radius: 10px; padding: 12px; margin-top: 4px; display: flex; flex-direction: column; gap: 10px; }
      .dl-openbal-head { font-weight: 700; font-size: 12.5px; color: var(--teal-dark); }

      .dl-field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
      .dl-field input, .dl-field select, .dl-select {
        font-family: var(--sans); font-size: 14px; padding: 8px 10px; border-radius: 7px;
        border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      }
      .dl-field input:focus, .dl-field select:focus, .dl-select:focus, .dl-munliters input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

      .dl-munliters { display: flex; align-items: center; gap: 4px; }
      .dl-munliters input {
        width: 56px; font-family: var(--mono); font-size: 13.5px; padding: 6px 7px;
        border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      }
      .dl-munliters-sep { font-size: 11px; color: var(--ink-soft); }

      .dl-toggle-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .dl-toggle { display: flex; background: var(--paper); border-radius: 9px; padding: 3px; gap: 2px; }
      .dl-toggle button {
        display: flex; align-items: center; gap: 6px; border: none; background: transparent;
        padding: 7px 12px; border-radius: 7px; font-size: 13px; cursor: pointer; color: var(--ink-soft); font-weight: 500;
      }
      .dl-toggle button.active { background: var(--teal); color: #fff; }
      .dl-date-input { font-family: var(--mono); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); }

      .dl-rate-entry {
        background: var(--paper); border: 1px dashed var(--gold); border-radius: 10px;
        padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
        font-size: 13px; font-weight: 600; color: var(--ink-soft);
      }
      .dl-rate-entry input {
        font-family: var(--mono); font-size: 15px; font-weight: 600; width: 120px; text-align: right;
        padding: 6px 9px; border-radius: 7px; border: 1px solid var(--line); color: var(--ink);
      }

      .dl-shoprate-grid {
        background: var(--paper); border: 1px dashed var(--gold); border-radius: 10px; padding: 12px 14px;
      }
      .dl-shoprate-head { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
      .dl-shoprate-row {
        display: grid; grid-template-columns: 90px 1fr 1fr; gap: 10px; align-items: center; padding: 4px 0;
      }
      .dl-shoprate-row:first-of-type { font-size: 11px; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
      .dl-shoprate-label { font-size: 12.5px; font-weight: 700; color: var(--shop); }
      .dl-shoprate-row input {
        font-family: var(--mono); font-size: 14px; padding: 6px 9px; border-radius: 7px;
        border: 1px solid var(--line); text-align: right; width: 100%;
      }

      .dl-shop-log-head-row, .dl-shop-log-row {
        display: grid; grid-template-columns: 1.3fr 1.3fr 1.3fr 1.6fr; gap: 10px; align-items: center;
        padding: 10px 14px; border-bottom: 1px solid var(--line);
      }
      .dl-shop-log-head-row { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ink-soft); background: var(--bg); }
      .dl-shop-contract-tag { font-family: var(--mono); font-size: 10px; color: var(--shop); font-weight: 700; margin-left: 6px; }
      .dl-shop-entry-col { display: flex; flex-direction: column; gap: 3px; }
      .dl-shop-bill-col { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; }
      .dl-shop-bill-line { color: var(--gold); font-weight: 600; }
      .dl-shop-bill-line.dl-short { color: var(--danger); }
      .dl-shop-invoice-type { margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
      .dl-shop-invoice-type:last-of-type { border-bottom: none; }

      .dl-log-table { background: var(--paper); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(23,38,37,0.06); }
      .dl-log-head-row, .dl-log-row {
        display: grid; grid-template-columns: 1.4fr 1fr 1.4fr 1.4fr; gap: 10px; align-items: center;
        padding: 10px 14px; border-bottom: 1px solid var(--line);
      }
      .dl-log-head-row-5, .dl-log-row-5 { grid-template-columns: 1.4fr 1fr 1.4fr 1.4fr 34px; }
      .dl-log-head-row { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ink-soft); background: var(--bg); }
      .dl-log-quota { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); }
      .dl-log-bill { font-family: var(--mono); font-size: 12.5px; }
      .dl-log-bill em { font-style: normal; color: var(--gold); margin-left: 4px; }
      .dl-log-bill em.dl-short { color: var(--danger); }
      .dl-invoice-table td.dl-neg { color: var(--danger); }
      .dl-log-foot {
        display: flex; justify-content: space-between; padding: 12px 14px; background: var(--bg);
        font-size: 13px; font-weight: 600; color: var(--teal-dark);
      }
      .dl-log-foot strong { font-family: var(--mono); }
